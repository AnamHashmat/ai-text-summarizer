<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Text Summarizer</title>
  <meta name="description" content="Paste long text and get a short, medium or detailed AI summary." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>AI Text Summarizer</h1>
      <p class="tagline">Paste long text and get a clear summary in seconds.</p>
    </div>
  </header>

  <main class="container">
    <!-- INPUT CARD -->
    <section class="card" aria-labelledby="input-title">
      <h2 id="input-title">Your text</h2>

      <label for="input-text" class="visually-hidden">Text to summarize</label>
      <textarea
        id="input-text"
        placeholder="Paste an article, email, report or notes here..."
        rows="10"
      ></textarea>

      <div class="meta-row">
        <span id="char-count">0 characters</span>
        <span id="word-count">0 words</span>
      </div>

      <div class="controls">
        <div class="field">
          <label for="summary-length">Summary length</label>
          <select id="summary-length">
            <option value="short">Short</option>
            <option value="medium" selected>Medium</option>
            <option value="detailed">Detailed</option>
          </select>
        </div>

        <div class="buttons">
          <button id="clear-btn" type="button" class="btn btn-secondary">Clear</button>
          <button id="summarize-btn" type="button" class="btn btn-primary">
            <span class="btn-label">Summarize Text</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <!-- Error message box (hidden until needed) -->
      <div id="error-box" class="alert alert-error" role="alert" hidden></div>
    </section>

    <!-- OUTPUT CARD -->
    <section class="card" aria-labelledby="output-title">
      <div class="card-head">
        <h2 id="output-title">Summary</h2>
        <button id="copy-btn" type="button" class="btn btn-small" disabled>Copy</button>
      </div>

      <div id="loading" class="loading" hidden>
        <span class="spinner spinner-dark" aria-hidden="true"></span>
        Generating summary...
      </div>

      <div id="summary-output" class="summary-output" aria-live="polite">
        <p class="placeholder">Your summary will appear here.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Summaries are generated by AI and may contain mistakes. Don't paste private or sensitive information.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
